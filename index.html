function raisedFlat(r,color,height,alpha=1){
 const pts=r.map(x=>mapProj(x));if(pts.some(p=>!p||!isFinite(p[0])||!isFinite(p[1])))return;
 const h=height;

 mc.beginPath();pts.forEach((p,i)=>i?mc.lineTo(p[0]+8,p[1]+h+10):mc.moveTo(p[0]+8,p[1]+h+10));mc.closePath();mc.fillStyle='rgba(6,19,28,.28)';mc.fill();
 for(let i=0;i<pts.length-1;i++){
  let a=pts[i],b=pts[i+1];if(b[0]<a[0] && b[1]<a[1])continue;
  mc.beginPath();mc.moveTo(a[0],a[1]-h);mc.lineTo(b[0],b[1]-h);mc.lineTo(b[0],b[1]+5);mc.lineTo(a[0],a[1]+5);mc.closePath();mc.fillStyle='#4c5051';mc.fill();mc.strokeStyle='rgba(252,228,182,.4)';mc.lineWidth=.7;mc.stroke();
 }
 mc.beginPath();pts.forEach((p,i)=>i?mc.lineTo(p[0],p[1]-h):mc.moveTo(p[0],p[1]-h));mc.closePath();mc.fillStyle=color;mc.fill();mc.strokeStyle='#fff0cf';mc.lineWidth=2;mc.stroke();
 mc.restore();
}

function cameraFor(s){return s.cam || initialCamera}
function cameraTween(){
 cancelAnimationFrame(animation);const to=cameraFor(states[index]),from=[rotation[0],rotation[1],zoom];const now=performance.now(),duration=1500;
 function loop(t){let k=Math.min(1,(t-now)/duration),ease=k*k*(3-2*k);
   rotation=[from[0]+(to[0]-from[0])*ease,from[1]+(to[1]-from[1])*ease];zoom=from[2]+(to[2]-from[2])*ease;reveal=ease;
   drawSphere();if(k<1)animation=requestAnimationFrame(loop)
 }
 animation=requestAnimationFrame(loop)
}

  syncNav();
  // Keep the actual patrol illustration mounted UNDER the film at all times.
  // Start fading before the final frame; ended is only a backup.
  const beginDissolve=()=>{
    if(index!==militaryAt||!wasMilitary||unit.classList.contains('yu-v362-video-done'))return;
    unit.classList.add('yu-military-show','yu-v362-video-done');
    schedule(()=>{
      if(index!==militaryAt||!wasMilitary)return;

  };

  v362Video.ontimeupdate=()=>{
    if(index!==militaryAt||!folding||unit.classList.contains('yu-v362-video-done'))return;

  };

    if(index!==militaryAt)return;

  },1200);

 }
 originalGo(n);

<script id="yu-v353-temple-entrance-transition-script">

 still.src=openingFrame;
 let lastIndex=index,active=false,finished=false,timers=[],serial=0;
 function timer(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}

 function setNavLock(lock){
  for(const id of ['prev','touchPrev','next','touchNext']){
   const el=document.getElementById(id);if(!el)continue;
   el.disabled=(id.toLowerCase().includes('prev')?index===0:index>=states.length-1);
  }

  if(!active)return;

  motion.onloadeddata=null;motion.oncanplay=null;motion.onerror=null;motion.onended=null;motion.ontimeupdate=null;motion.pause();
  motion.removeAttribute('src');motion.load();

 }

  if(!active||finished||stamp!==serial)return;

 }

  leave(); clear();active=true;finished=false;

})();

<script id="yu-v354-exhibition-gallery-behaviour">
(()=>{
  const scene=document.getElementById('yu-v350-religion');
  if(!scene)return;
  const area=scene.querySelector('.yu-rel-exhibit-content');
  const shell=scene.querySelector('.yu-rel-exhibit');
  if(!area||!shell)return;
  area.addEventListener('click',event=>{
    const choice=event.target.closest('button[data-collection]');
    if(!choice)return;
    event.preventDefault();event.stopPropagation();
    const root=choice.closest('.yu-m54-layout');
    const pic=root?.querySelector('.yu-m54-feature-image');
    const thumb=choice.querySelector('img[data-asset]');
    if(!pic||!thumb)return;
    pic.src=thumb.src;
    pic.dataset.asset=thumb.dataset.asset;
    pic.alt=thumb.alt.replace('縮圖','');
    root.querySelectorAll('button[data-collection]').forEach(b=>{b.classList.toggle('is-chosen',b===choice);b.setAttribute('aria-pressed',String(b===choice));});
    area.querySelectorAll('.yu-m54-dynamic[data-info]').forEach(block=>block.hidden=block.dataset.info!==choice.dataset.collection);
  });
  // Close the photo viewer first; preserve the active exhibit until the next close.
  const origClose=shell.querySelector('.yu-rel-exhibit-close');
  if(origClose){origClose.addEventListener('click',()=>{const zm=shell.querySelector('.yu-rel-zoom.is-active .yu-rel-zoom-close');if(zm)zm.click()},true)}
  window.__yuanReligionV354={galleryVersion:'2026-11-25',hasNewLayout:()=>!!area.querySelector('.yu-m54-layout')};
})();
</script>

<script id="yu-v355-floating-art-interaction">
(()=>{
 'use strict';
 const scene=document.getElementById('yu-v350-religion');
 const content=scene?.querySelector('.yu-rel-exhibit-content');
 if(!scene||!content)return;
 const pic=(asset,desc,classes,caption='')=>`<figure class="yu-m55-art ${classes}"><img data-asset="${asset}" alt="${desc}" /><figcaption>${caption}</figcaption></figure>`;
 const make=(kind)=>{
  if(kind==='lama')return `<div class="yu-m55-stage yu-m55-lama" role="document">
   <div class="yu-m55-eyebrow">元朝宗教政策 · 藏傳佛教</div>
   ${pic('phagpa','八思巴古畫肖像','yu-m55-portrait')}
   ${pic('duo','康寧寺供奉的八思巴與忽必烈像','yu-m55-float yu-m55-lama-duo','八思巴與忽必烈像')}
   <div class="yu-m55-seal" aria-hidden="true"></div>
   <section class="yu-m55-story"><h2 class="yu-m55-title">八思巴（1235–1280）</h2>
    <p>西藏佛教薩迦派高僧，深受<strong>忽必烈</strong>尊崇。</p>
    <div class="yu-m55-rows">
    <div class="yu-m55-row"><strong class="yu-m55-year">1260 年</strong><span>獲忽必烈封為<strong>國師</strong>。</span></div>
    <div class="yu-m55-row"><strong class="yu-m55-year">1269 年</strong><span>奉命創製<strong>八思巴文</strong>，作為官方文字。</span></div>
    <div class="yu-m55-row"><strong class="yu-m55-year">1270 年</strong><span>獲尊為<strong>帝師</strong>，參與管理全國佛教事務。</span></div></div>
    <p class="yu-m55-signature">八思巴受到重用，反映元朝統治者特別尊崇藏傳佛教。</p>
   </section></div>`;
  if(kind==='tower')return `<div class="yu-m55-stage yu-m55-tower" role="document">
   <div class="yu-m55-eyebrow">元朝宗教政策 · 皇家佛寺</div>
   ${pic('towerwide','北京妙應寺白塔與寺院全景','yu-m55-tower-main')}
   ${pic('towerclose','北京妙應寺白塔近景','yu-m55-float yu-m55-tower-close','白塔近景')}
   ${pic('anigo','阿尼哥紀念雕像','yu-m55-float yu-m55-anigo','阿尼哥像')}
   <section class="yu-m55-story"><h2 class="yu-m55-title">大聖壽萬安寺</h2><p><strong>今北京妙應寺</strong>。元朝重要的皇家藏傳佛教寺院，白塔由尼泊爾工匠<strong>阿尼哥</strong>設計建造。</p>
   <div class="yu-m55-rows"><div class="yu-m55-row"><strong class="yu-m55-year">1271 年</strong><span>忽必烈下令興建白塔。</span></div>
   <div class="yu-m55-row"><strong class="yu-m55-year">1279 年</strong><span>白塔落成。</span></div>
   <div class="yu-m55-row"><strong class="yu-m55-year">1288 年</strong><span>寺院落成，成為重要皇家佛寺。</span></div></div>
   <p class="yu-m55-signature"><strong>阿尼哥（1244–1306）</strong> 經八思巴推薦，受到忽必烈重用。</p></section></div>`;
  return `<div class="yu-m55-stage yu-m55-christian" role="document">
   <div class="yu-m55-eyebrow">元朝宗教政策 · 宗教自由</div>
   ${pic('monte','孟德高維諾後世繪像','yu-m55-christian-main')}
   ${pic('lotus','元代蓮花十字架石刻','yu-m55-float yu-m55-lotus','蓮花十字架')}
   ${pic('grave','1331年瑪爾達公主墓碑','yu-m55-float yu-m55-grave','1331 年墓碑')}
   <section class="yu-m55-story"><h2 class="yu-m55-title">也里可溫教</h2>
    <p><strong>元代基督宗教的統稱</strong>，包括景教及羅馬天主教。</p>
    <p>部分蒙古皇族及色目人信奉此教。</p>
    <div class="yu-m55-rows"><div class="yu-m55-row"><strong class="yu-m55-year">1294 年</strong><span>羅馬天主教傳教士<strong>孟德高維諾</strong>抵達元大都，獲准傳教。</span></div>
    <div class="yu-m55-row"><strong class="yu-m55-year">元代</strong><span>十字架石刻與基督徒墓碑，見證宗教在中國傳播。</span></div></div>
    <p class="yu-m55-signature">不同基督宗教傳統的史料，反映元代宗教文化交流。</p>
   </section></div>`;
 };
 let working=false;
 function redesign(){
  if(working||content.querySelector('.yu-m55-stage'))return;
  const title=content.querySelector('.yu-m54-header h2');
  if(!title)return;
  const imgs=[...content.querySelectorAll('img[data-asset]')];
  const imageMap={};for(const im of imgs){if(im.src)imageMap[im.dataset.asset]=im.src}
  const kind=title.textContent.includes('八思巴')?'lama':title.textContent.includes('大聖壽')?'tower':'christian';
  working=true; content.innerHTML=make(kind);
  content.querySelectorAll('img[data-asset]').forEach(im=>{im.src=imageMap[im.dataset.asset]||'';});
  working=false;
 }
 new MutationObserver(redesign).observe(content,{childList:true,subtree:false});
 // The existing overlay retains its close button and original keyboard/slide navigation.
 window.__yuanReligionV355={design:'Genghis-style independent floating exhibits',isActive:()=>!!content.querySelector('.yu-m55-stage')};
})();
</script>
